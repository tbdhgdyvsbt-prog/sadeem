name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # تحديث إلى نسخة أكثر استقراراً
          channel: 'stable'

      - name: Build Project
        run: |
          flutter config --no-analytics
          flutter create my_app
          cd my_app
          flutter pub get
          # استخدام أمر بناء يتجاوز بعض قيود التحقق الصارمة
          flutter build apk --release --no-pub --quiet

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
